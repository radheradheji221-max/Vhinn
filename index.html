<script>

function at(s,sq,by){const b=s.b,r=sq>>3,f=sq&7,X=(a,c)=>{const R=r+a,F=f+c;return R>=0&&R<8&&F>=0&&F<8?b[R*8+F]:null};
const pc=by=='w'?'P':'p',n=by=='w'?'N':'n',k=by=='w'?'K':'k',pd=by=='w'?1:-1;
if(X(pd,-1)==pc||X(pd,1)==pc)return 1;for(const[a,c]of N)if(X(a,c)==n)return 1;for(const[a,c]of K)if(X(a,c)==k)return 1;

function gen(s){const m=[],b=s.b,me=s.t;
for(let i=0;i<64;i++){const c=b[i];if(!c||col(c)!=me)continue;const p=c.toLowerCase(),r=i>>3,f=i&7,add=(t,x={})=>m.push({f:i,t,...x});
if(p=='p'){const d=me=='w'?-1:1,sr=me=='w'?6:1,pr=me=='w'?0:7,one=i+d*8;
if(!b[one]){if((one>>3)==pr)'qrbn'.split('').forEach(q=>add(one,{p:q}));else{add(one);if(r==sr&&!b[one+d*8])add(one+d*8,{dp:1})}}
[-1,1].forEach(dx=>{const nf=f+dx;if(nf<0||nf>7)return;const t=one+dx;if(t<0||t>63)return;
if(b[t]&&col(b[t])!=me){if((t>>3)==pr)'qrbn'.split('').forEach(q=>add(t,{p:q}));else add(t)}else if(t==s.ep)add(t,{ep:1})})}
else if(p=='n'||p=='k'){for(const[a,c]of(p=='n'?N:K)){const R=r+a,F=f+c;if(R<0||R>7||F<0||F>7)continue;const x=b[R*8+F];if(!x||col(x)!=me)add(R*8+F)}
if(p=='k'){const o=me=='w'?'b':'w',h=me=='w'?60:4,ks=me=='w'?'K':'k',qs=me=='w'?'Q':'q';
if(i==h&&!at(s,i,o)){if(s.c.includes(ks)&&!b[h+1]&&!b[h+2]&&!at(s,h+1,o)&&!at(s,h+2,o))add(h+2,{cas:1});
if(s.c.includes(qs)&&!b[h-1]&&!b[h-2]&&!b[h-3]&&!at(s,h-1,o)&&!at(s,h-2,o))add(h-2,{cas:1})}}}
else for(const[a,c]of K){if(p=='r'&&a&&c)continue;if(p=='b'&&!(a&&c))continue;let R=r+a,F=f+c;
while(R>=0&&R<8&&F>=0&&F<8){const x=b[R*8+F];if(!x)add(R*8+F);else{if(col(x)!=me)add(R*8+F);break}R+=a;F+=c}}}
return m}
function mk(s,m){const b=s.b.slice(),pc=b[m.f],me=col(pc);let ep=-1,cp=b[m.t];
b[m.t]=m.p?(me=='w'?m.p.toUpperCase():m.p):pc;b[m.f]=0;
if(m.ep){b[m.t+(me=='w'?8:-8)]=0;cp=1}
if(m.cas){if(m.t>m.f){b[m.f+1]=b[m.f+3];b[m.f+3]=0}else{b[m.f-1]=b[m.f-4];b[m.f-4]=0}}
if(m.dp)ep=(m.f+m.t)/2;
let c=s.c;for(const q of[m.f,m.t]){const R={60:'KQ',63:'K',56:'Q',4:'kq',7:'k',0:'q'}[q];if(R)for(const ch of R)c=c.replace(ch,'')}
return{b,t:me=='w'?'b':'w',c,ep,hm:(pc.toLowerCase()=='p'||cp)?0:s.hm+1}}
function chk(s,side){const k=s.b.indexOf(side=='w'?'K':'k');return at(s,k,side=='w'?'b':'w')}
function legal(s){return gen(s).filter(m=>!chk(mk(s,m),s.t))}
function ev(s){let v=0;for(let i=0;i<64;i++){const c=s.b[i];if(!c)continue;const p=c.toLowerCase(),w=col(c)=='w',r=i>>3,f=i&7,cd=Math.max(Math.abs(r-3.5),Math.abs(f-3.5));let x=V[p];
if(p=='n'||p=='b')x+=(3-cd)*10;if(p=='p')x+=(w?6-r:r-1)*6+(3-cd)*4;v+=w?x:-x}return s.t=='w'?v:-v}

function qs(s,a,b,d){const st=ev(s);if(d==0||st>=b)return st;if(st>a)a=st;
const ms=gen(s).filter(m=>s.b[m.t]||m.ep).sort((x,y)=>cv(s,y)-cv(s,x));
for(const m of ms){const n=mk(s,m);if(chk(n,s.t))continue;const v=-qs(n,-b,-a,d-1);if(v>=b)return v;if(v>a)a=v}return a}

const ms=legal(s).sort((x,y)=>cv(s,y)-cv(s,x));if(!ms.length)return chk(s,s.t)?-30000+ply:0;
for(const m of ms){const v=-se(mk(s,m),d-1,-b,-a,ply+1);if(v>=b)return v;if(v>a)a=v}return a}
function scoreMoves(s,d){return legal(s).map(m=>({m,v:-se(mk(s,m),d-1,-1e5,1e5,1)}))}
function botPick(s,elo){const mx=elo<=800?1:elo<=1800?2:3,noise=Math.max(0,2300-elo)/3.5;let res=null;DL=Date.now()+1500;AB=0;

res.forEach(x=>x.v+=(Math.random()-.5)*2*noise);res.sort((a,b)=>b.v-a.v);return res[0].m}
function insuf(s){const p=s.b.filter(x=>x&&x.toLowerCase()!='k');return !p.length||(p.length==1&&'nbNB'.includes(p[0]))}

if(G.s.hm>=100||insuf(G.s)||G.seen[key]>=3){board('Draw');return fin('draw')}

const SQ=i=>'abcdefgh'[i&7]+(8-(i>>3));
function san(s,m){const pc=s.b[m.f],cap=s.b[m.t]||m.ep,n=mk(s,m),u=pc.toUpperCase();if(m.cas)return m.t>m.f?'O-O':'O-O-O';
return(u=='P'?(cap?'abcdefgh'[m.f&7]:''):u)+(cap?'x':'')+SQ(m.t)+(m.p?'='+m.p.toUpperCase():'')+(chk(n,n.t)?'+':'')}
function review(i){RS=0;const g=me().g[i];G=null;$('app').innerHTML=`<div class="card"><h2>Game Review</h2><p id="pr">Analysing…</p></div><div id="rv"></div>`;
let s=start(),k=0,rows=[],st=[s],tot={},loss={w:[],b:[]};
function step(){if(k>=g.mv.length)return done();AB=0;DL=1e15;const[f,t,p]=g.mv[k],side=s.t,sc=scoreMoves(s,1).sort((a,b)=>b.v-a.v),pl=sc.find(x=>x.m.f==f&&x.m.t==t&&(x.m.p||'')==p),best=sc[0].v,ls=Math.max(0,best-pl.v),m=pl.m,pc=s.b[f],cap=s.b[t]||m.ep;let lab;
if(k<8&&ls<=30)lab='Book';else if(ls<=10)lab='Best';else if(ls<=30)lab='Excellent';else if(ls<=70)lab='Good';else if(ls<=150)lab='Inaccuracy';else if(ls<=300)lab='Mistake';else lab='Blunder';
const n=mk(s,m),pv=V[pc.toLowerCase()],cv2=cap?V[(s.b[t]||'p').toLowerCase()]:0;
if(ls<=30&&k>=8){if(pv>=300&&pv-cv2>=200&&at(n,t,n.t)&&pl.v>=-50&&pl.v>=best-30)lab='Brilliant';else if(lab=='Best'&&sc.length>1&&best-sc[1].v>=150&&best>-300)lab='Great'}
rows.push({side,nm:san(s,m),lab,ev:side=='w'?pl.v:-pl.v,bm:san(s,sc[0].m),fr:f,to:t,ls});tot[side+lab]=(tot[side+lab]||0)+1;loss[side].push(Math.min(ls,500));st.push(n);s=n;k++;$('pr').textContent=`Analysing move ${k}/${g.mv.length}…`;setTimeout(step,0)}
function done(){const acc=a=>a.length?Math.round(100/(1+a.reduce((x,y)=>x+y,0)/a.length/60)):'-',IC={Brilliant:'!!',Great:'!',Best:'★',Excellent:'✓',Good:'✓',Book:'≡',Inaccuracy:'?!',Mistake:'?',Blunder:'??'},L=Object.keys(IC),fl=g.my=='b';
const sm=sd=>L.map(l=>`<div class="mv"><span class="tag ${l}">${IC[l]} ${l}</span><b>${tot[sd+l]||0}</b></div>`).join(''),W=g.my=='w'?esc(D.cur):NAMES[g.bot],B=g.my=='w'?NAMES[g.bot]:esc(D.cur);
const cm=(()=>{const me=g.my,n=l=>tot[me+l]||0,mine=rows.map((r,j)=>({...r,j})).filter(r=>r.side==me),a=acc(loss[me]),end=st[st.length-1],mate=!legal(end).length&&chk(end,end.t),winner=end.t=='w'?'b':'w',lr=rows[rows.length-1];
let head,w=[],imp=[];
if(mate&&winner==me)head=`🏆 <b>Checkmate with ${lr.nm}!</b> What a brilliant finish — calm, sharp and ruthless. You played like a true champion. I'm proud of you, keep climbing!`;
else if(mate)head=`You got checkmated this time, but you fought well. Every strong player has lost games like this — it's exactly how you grow.`;
else if(g.r=='draw')head=`A hard-fought draw — you held your ground and didn't give up.`;
else head=`You resigned this one, but that's okay. Learn from it and come back stronger!`;
if(a!='-'){w.push(a>=90?`Outstanding precision — ${a}% accuracy is master-level stuff.`:a>=75?`Strong, confident play with ${a}% accuracy.`:a>=55?`A solid game with good ideas (${a}% accuracy).`:`You showed real fighting spirit (${a}% accuracy) and there is plenty of room to grow.`)}
if(n('Brilliant'))w.push(`You found ${n('Brilliant')} brilliant move${n('Brilliant')>1?'s':''} — that kind of vision is rare!`);
if(n('Great'))w.push(`${n('Great')} great move${n('Great')>1?'s':''} showed real tactical sense.`);
if(n('Best')>=5)w.push(`You found the best move ${n('Best')} times.`);
const bl=n('Blunder'),mi=n('Mistake'),ia=n('Inaccuracy'),worst=mine.slice().sort((x,y)=>y.ls-x.ls)[0];
if(bl)imp.push(`${bl} blunder${bl>1?'s':''}: before every move, ask "what does my opponent's last move attack, and is everything of mine protected?"${worst&&worst.ls>150?` Your biggest swing was move ${(worst.j>>1)+1} (${worst.nm}) — ${worst.bm} was better.`:''}`);
if(mi)imp.push(`${mi} mistake${mi>1?'s':''}: slow down in tense positions and compare at least two candidate moves.`);
if(ia>=3)imp.push(`${ia} small inaccuracies: look for the most active square for each piece and keep your pieces defended.`);
if(mine.filter(r=>r.j<16&&['Mistake','Blunder'].includes(r.lab)).length)imp.push(`Opening: control the centre, develop knights and bishops, and castle early.`);
if(mine.filter(r=>r.j>50&&['Mistake','Blunder'].includes(r.lab)).length)imp.push(`Endgame: stay focused late in the game — activate your king and push passed pawns.`);
if(!imp.length)imp.push(a=='-'?`Play a few more moves for a full review.`:`Nothing major to fix — try a stronger bot to keep growing!`);
return`<div class="card"><h3>💬 Saksham's Review</h3><p>${head}</p><p>${w.join(' ')}</p><p><b>${mate&&winner==me?'To polish':'To improve'}:</b></p><ul>${imp.map(x=>`<li>${x}</li>`).join('')}</ul></div>`})();
$('pr').innerHTML=`Reviewed by <b style="color:var(--ne2)">SAKSHAM Vijay</b> · ${g.dt}`;
$('rv').innerHTML=`<div class="card row" style="text-align:center"><div style="flex:1"><div class="b">⚪ ${W}</div><h2>${acc(loss.w)}%</h2><div class="b">Accuracy</div></div><div style="flex:1"><div class="b">⚫ ${B}</div><h2>${acc(loss.b)}%</h2><div class="b">Accuracy</div></div></div>
${cm}<div id="vw"></div><div class="row" style="justify-content:center;gap:8px"><button onclick="sh(0)">⏮</button><button onclick="sh(RV-1)">◀</button><button onclick="sh(RV+1)">▶</button><button onclick="sh(999)">⏭</button></div>
<div class="card"><h3>Summary</h3><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:130px">${sm('w')}</div><div style="flex:1;min-width:130px">${sm('b')}</div></div></div>
<div class="card"><h3>Moves</h3><div id="ml">${rows.map((r,j)=>`<div class="mv" id="m${j+1}" onclick="sh(${j+1})"><span>${r.side=='w'?((j>>1)+1)+'.':'…'} ${r.nm}</span><span class="tag ${r.lab}">${IC[r.lab]}</span></div>`).join('')}</div></div><button onclick="go('History')">Back</button>`;
window.sh=function(j){j=Math.max(0,Math.min(rows.length,j));const _r=rows[j-1];if(RS&&_r&&j!=RV){const nm=_r.nm;snd(/\+/.test(nm)?'check':/^O-O/.test(nm)?'castle':/=/.test(nm)?'promo':/x/.test(nm)?'cap':(_r.side==g.my?'move':'opp'))}RV=j;const q=st[j],r=rows[j-1],ev=r?r.ev:0,pc=Math.max(4,Math.min(96,50+46*Math.tanh(ev/400)));let h='';
for(let z=0;z<64;z++){const x=fl?63-z:z,c=q.b[x],lt=((x>>3)+(x&7))%2==0;h+=`<div class="sq ${lt?'l':'d'} ${r&&(r.fr==x||r.to==x)?'last':''}">${c?`<span class="${col(c)=='w'?'w':'k'}">${GL[c.toUpperCase()]}&#xFE0E;</span>`:''}</div>`}
const e=Math.abs(ev)>20000?'#':(ev>=0?'+':'')+(ev/100).toFixed(1);
$('vw').innerHTML=`<div class="evb"><div style="width:${pc}%"></div><span>${e}</span></div><div id="bd">${h}</div><div class="card" style="text-align:center">${r?`<span class="tag ${r.lab}">${IC[r.lab]}</span> <b>${r.nm}</b> is ${r.lab.toLowerCase()}${['Inaccuracy','Mistake','Blunder'].includes(r.lab)?` · best was <b>${r.bm}</b>`:''}`:'Starting position'}</div>`;
document.querySelectorAll('#ml .mv').forEach(d=>d.classList.remove('cur'));const cu=$('m'+j);if(cu){cu.classList.add('cur');$('ml').scrollTop=cu.offsetTop-90}};
window.sh(rows.length);RS=1}

function rules(){$('app').innerHTML=`<div class="card"><h2>Rule book</h2>
<details open><summary>1. The basics</summary><p>Chess is played on an 8×8 board by two players, White and Black. White moves first, then you alternate. The bottom-right square is always light. Each side starts with 16 pieces: 8 pawns, 2 rooks, 2 knights, 2 bishops, 1 queen, 1 king. The goal is to checkmate the enemy king.</p></details>
<details><summary>2. How pieces move</summary><ul><li><b>Rook:</b> any distance straight, along rows or columns.</li><li><b>Bishop:</b> any distance diagonally (stays on one colour).</li><li><b>Queen:</b> rook + bishop combined.</li><li><b>King:</b> one square in any direction.</li><li><b>Knight:</b> an L-shape (2+1) and it can jump over pieces.</li><li><b>Pawn:</b> forward one square (two from its start square), captures one square diagonally forward.</li></ul></details>
<details><summary>3. Capturing, check &amp; checkmate</summary><p>You capture by moving onto an enemy piece. A king under attack is in <b>check</b> and you must escape: move the king, block, or capture the attacker. If there is no escape it is <b>checkmate</b> and the game ends. You can never make a move that leaves your own king in check.</p></details>
<details><summary>4. Piece values</summary><p>Pawn 1, Knight 3, Bishop 3, Rook 5, Queen 9. Use these to judge trades. The king is priceless.</p></details>
<details><summary>5. Special moves</summary><ul><li><b>Castling:</b> king moves two squares toward a rook and the rook jumps over. Allowed only if neither piece has moved, squares between are empty, and the king isn't in check or passing through/landing on an attacked square.</li><li><b>Promotion:</b> a pawn reaching the last rank becomes a queen, rook, bishop or knight (this game auto-queens).</li><li><b>En passant:</b> if an enemy pawn jumps two squares and lands beside your pawn, you may capture it as if it moved one square – but only on the very next move.</li></ul></details>
<details><summary>6. Draws</summary><ul><li><b>Stalemate:</b> player to move has no legal move and is not in check.</li><li><b>Insufficient material:</b> e.g. king vs king, or king + one minor piece vs king.</li><li><b>Threefold repetition:</b> same position three times.</li><li><b>50-move rule:</b> 50 moves with no pawn move or capture.</li></ul></details>
<details><summary>7. Opening principles</summary><p>Control the centre (e4, d4, e5, d5), develop knights and bishops early, castle to protect your king, don't move the same piece twice without reason, and don't bring the queen out too early.</p></details>
<details><summary>8. Tactics</summary><p><b>Fork:</b> one piece attacks two at once. <b>Pin:</b> a piece can't move without exposing a more valuable one behind it. <b>Skewer:</b> a pin in reverse. <b>Discovered attack:</b> moving a piece reveals an attack by another. <b>Double check</b> and <b>deflection</b> are powerful too.</p></details>
<details><summary>9. Checkmate patterns</summary><p>Back-rank mate, smothered mate, Scholar's mate, Anastasia's mate, and the basic endgame mates: king + queen vs king, king + rook vs king.</p></details>
<details><summary>10. Endgame &amp; strategy</summary><p>Activate your king, create passed pawns, learn the <b>opposition</b>, rook behind passed pawns, and the <b>Lucena</b> and <b>Philidor</b> positions. In middlegames: weak squares, outposts, pawn structure, open files, and the bishop pair.</p></details>
<details><summary>11. Game review labels</summary><p><b>Brilliant</b> – a strong, hard-to-find sacrifice. <b>Great</b> – the only good move. <b>Best</b>, <b>Excellent</b>, <b>Good</b> – solid. <b>Book</b> – known opening. <b>Inaccuracy</b>, <b>Mistake</b>, <b>Blunder</b> – increasingly costly errors.</p></details>
<details><summary>12. Elo in Goatchess</summary><p>Your first 3 games: win +40, loss −40. After that: win +11, loss −11. Draws change nothing.</p></details></div>`}
